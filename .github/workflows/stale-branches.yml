name: stale-branches

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: List remote branches with no commits in 60 days
        run: |
          cutoff=$(date -d "60 days ago" +%s)
          {
            echo "## Stale remote branches (no commit in 60 days)"
            echo
            git for-each-ref --format='%(committerdate:unix) %(refname:short) %(committerdate:short)' refs/remotes/origin |
              grep -v ' origin/HEAD' | while read -r ts ref day; do
                if [ "$ts" -lt "$cutoff" ]; then echo "- \`$ref\` (last commit $day)"; fi
              done
          } | tee -a "$GITHUB_STEP_SUMMARY"
